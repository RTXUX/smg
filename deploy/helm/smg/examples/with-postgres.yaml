# Router with PostgreSQL history backend.
# Usage: helm install smg deploy/helm/smg -f deploy/helm/smg/examples/with-postgres.yaml
router:
  workerUrls:
    - http://worker-1:8000
history:
  backend: postgres
  postgres:
    host: postgres
    port: 5432
    database: smg
    username:
      secretKeyRef: {name: smg-postgres, key: username}
    password:
      secretKeyRef: {name: smg-postgres, key: password}
    poolMax: 10
