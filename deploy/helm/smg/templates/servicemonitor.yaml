{{- if .Values.router.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "smg.fullname" . }}-router
  labels:
    {{- include "smg.labels" . | nindent 4 }}
    {{- range $key, $value := .Values.router.metrics.serviceMonitor.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "smg.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: router
  endpoints:
    - port: metrics
      interval: {{ .Values.router.metrics.serviceMonitor.interval }}
    {{- if .Values.router.metrics.serviceMonitor.engineMetrics.enabled }}
    - port: http
      path: /engine_metrics
      interval: {{ default .Values.router.metrics.serviceMonitor.interval .Values.router.metrics.serviceMonitor.engineMetrics.interval }}
      {{- with .Values.router.metrics.serviceMonitor.engineMetrics.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
    {{- end }}
{{- end }}
